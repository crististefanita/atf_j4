  - "low_covers_and_shared_sequences"
  - "public_voids_and_ruff_threats"
  - "lead_and_table_position"
  - "known_bid_prefix_during_bidding"
  - "all_contracts_and_remaining_need_during_play"
  - "already_over_or_unreachable_contract"
  - "last_bid_restriction"
  - "series5_or10_and_current_streak"
calibration_policy:
  partition: "development_only"
  heldout: "never read for fitting"
  unit: "clustered initial full-world/seat/suit; repeated trajectories do not add independent evidence"
  prior_worlds: 20
  production_activation: "Requires a separate ablation and untouched evaluation; descriptive association is not causal strength."
