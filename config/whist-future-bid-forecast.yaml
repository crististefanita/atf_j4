rules:
  - id: "LITERAL_OBSERVED_CONTRACTS"
    rule_ro: "Păstrează licitațiile deja făcute; o presupunere nu înlocuiește un contract public."
    rule_en: "Keep submitted public contracts literal; a forecast cannot replace them."
    kind: "HARD_INPUT_FACT"
    test: "actualPriorBidsAndTheProposedOwnContractStayAuthoritative"
  - id: "OWN_COUNTERFACTUAL"
    rule_ro: "Pentru fiecare licitație proprie evaluată, folosește chiar acea valoare în prefixul adversarilor următori."
    rule_en: "Each own counterfactual bid is authoritative for the following auction prefix."
    kind: "SIMULATION_CONTRACT"
    test: "actualPriorBidsAndTheProposedOwnContractStayAuthoritative"
  - id: "EVOLVING_PREFIX"
    rule_ro: "Estimează în ordinea licitării. Prefixul următor include licitațiile publice, contractul propriu evaluat și estimările anterioare."
    rule_en: "Forecast in auction order using preceding public bids, the own counterfactual and preceding forecasts."
    dynamic_context: ["hypothetical original holding", "trump", "turned card", "auction position", "preceding bid sum", "prefix overbooking"]
    action: "Mode of the legal conditioned observed-bid distribution; exact ties prefer the lower bid."
    limitation: "One modal continuation, not integration over every possible future auction. Hypothetical world cards are never actual private opponent inputs."
    test: "futureForecastsUseTheEvolvingAuctionPrefixAndSeatOrder"
  - id: "LEGAL_LAST_BID"
    rule_ro: "Elimină ultima licitație care ar egala totalul cu numărul levatelor și renormalizează distribuția."
    rule_en: "Exclude the forbidden final total and renormalize the distribution."
    kind: "RULE_CONSTRAINT"
    test: "forecastRespectsTheLastBidRestrictionAcrossSizesTwoThroughEight"
  - id: "UNCHANGED_FALLBACK"
    rule_ro: "La o carte, alt mod sau o mână ipotetică inițială invalidă, păstrează exact estimarea acceptată."
    rule_en: "One-card, other modes or invalid original hypothetical holdings retain the accepted forecast."
    test: "unsupportedModesSizesAndInvalidOriginalHandsKeepTheFrozenForecast"
