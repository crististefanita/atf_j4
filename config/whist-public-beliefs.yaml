  active_runtime: "Accepted Hard policy; this experimental model has runtime influence zero."
semantics:
  rule_ro: "Licitația sugerează mâini plauzibile; nu dovedește că un adversar are sau nu are o carte."
  rule_en: "A bid changes the plausibility of hypothetical holdings; it never proves card ownership."
  target: "Observed bidding behavior, not optimal bids, intrinsic card values or perfect play."
  evolution: "Fixed fitted coefficients; feasible worlds, public-card exclusions and action needs are recomputed from each observation."
  uncertainty: "Approximate model-relative weighting; the matching sampler is not proven uniform over feasible deals. No calibrated full joint posterior claim."
  covers: "A zero conditional coefficient does not prove that low covers are strategically useless; correlated features share explanatory power."
information_contract:
  allowed: ["own cards", "chronological public plays", "current table", "turned card", "preceding public bids", "won counts", "remaining counts", "public scores and streaks for action utility", "rules"]
  forbidden: ["actual private opponent holdings", "future bids", "future plays", "fresh-evaluation labels for fitting"]
  bid_time: "Reconstruct each sampled original holding from its remaining cards and that seat's public plays; deduplicate the current table already present in history."
  bid_prefix: "For each observed bid use only bids preceding that actor; exclude the observer's own counterfactual bid as evidence."
  later_context: "Later score, won-count and streak metadata are not retrospective features of the earlier observed bid."
  undealt: "Unassigned pool cards remain undealt; do not force every unseen card into an opponent hand."
objective_priority:
  - "Follow suit and mandatory trump before strategy."
  - "For Romanian sampled actions maximize estimated own exact-contract probability."
  - "Then prefer own expected points, then reduce the strongest rival's estimated score."
  - "Keep accepted universal contract and salvage guards; a likelihood estimate cannot certify a line."
dynamic_context:
  own_need: "own bid - own completed tricks won; preserve its sign."
  opponent_need: "opponent bid - that opponent's completed tricks won; used as each actor's target minus won during continuation."
  opportunities: "(sum remaining cards + cards on current table) / player count; incomplete trick counts once."
  progress: "Public exclusions and proven voids accumulate after actual plays. Candidate weights are recomputed on newly feasible worlds."
  bid_model_coefficients_change_during_hand: false
  voluntary_play_likelihood_implemented: false
  continuation_limit: "Accepted greedy rollout uses need>0 to take, otherwise to duck; it does not implement the rejected R13 pressure schedule or a learned opponent action policy."
  small_endgame_limit: "Per-world MaxN is a declared possible-deal continuation, not proof of a globally optimal imperfect-information strategy."
hard_facts:
  - id: "PUBLIC_CARD_LEDGER"
    rule_ro: "Exclude cărțile proprii, toate cărțile public jucate și cartea întoarsă din mâinile ascunse."
    rule_en: "Exclude own, publicly played and turned cards from hidden holdings."
    enforcement: "MonteCarloAi.unknownCards; existing active constraint."
    tests: ["ai08TurnedCardAndEveryPubliclyPlayedCardAreExcludedFromHiddenDeals"]
  - id: "PROVEN_VOIDS"
    rule_ro: "Nerespectarea culorii dovedește lipsa ei; discardul lateral fără culoare în Whist românesc dovedește și lipsa atuului."
    rule_en: "Failure to follow proves a void; a Romanian off-suit, off-trump discard also proves no trump."
    enforcement: "MonteCarloAi.knownVoids and legal-card rules; valid session history includes current table as its suffix."
  - id: "LAST_BID_LEGALITY"
    rule_ro: "Ultimul jucător nu poate licita valoarea care egalizează totalul cu numărul de levate."
    rule_en: "The last bidder cannot make total bids equal available tricks."
    enforcement: "Zero likelihood only for the legally forbidden bid; normalize the remaining bids."
    tests: ["lastBidRestrictionIsRenormalizedAtEveryHandSize"]
soft_evidence:
  model_strength: 0.25
  uniform_mass: 0.75
  mean: "clamp(8 * dot(features, coefficients), 0, initial_hand_size)"
  likelihood: "0.75 / legal_bid_count + 0.25 * normalized_discrete_Gaussian(bid, mean, sigma[size])"
  world_weight: "Product over observed opponents of legal_bid_count * likelihood(observed_bid), then clip to[0.25,4]."
  world_weight_min: 0.25
  world_weight_max: 4.0
  effective_sample_size: "sum(weights)^2 / sum(weights^2)"
  minimum_effective_sample_fraction: 0.5
  variation_required: "max(weight) - min(weight) >1e-12"
  fallback: "Keep the accepted unweighted estimate when support is too concentrated, all weights are constant, evidence is missing/inconsistent or scope is unsupported."
  zero_bid: "Never hard-excludes master trumps or high cards."
  first_bid: "No previous observed bids means uniform evidence; do not invent the future auction."
  tests: ["zeroBidCannotExcludeMasterTrumps", "knownBidsSoftlyRankPossibleOpponentHands", "concentratedWeightsFallBackToTheAcceptedSamplerEstimate", "constantNonUnitLikelihoodCancelsInsteadOfInventingInformation", "playedCardsReconstructTheOriginalHandWithoutDoubleCountingTheCurrentTable", "actualHiddenOpponentCardsCannotChangeTheDecisionWithAKnownBidPrefix"]
