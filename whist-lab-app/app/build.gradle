plugins {
    id "com.android.application"
}

android {
    namespace "ro.whistlab.app"
    compileSdk 36

    defaultConfig {
        applicationId "ro.whistlab.app"
        minSdk 24
        targetSdk 36
        versionCode 6
        versionName "0.1.5"
        testInstrumentationRunner "android.test.InstrumentationTestRunner"
    }

    buildFeatures {
        buildConfig true
    }

    testOptions.unitTests.all {
        def archive = providers.gradleProperty("whist.scoreHistoryTraceDir").getOrElse("")
        if (archive) {
            def folder = rootProject.file(archive)
            systemProperty "whist.scoreHistoryTraceDir", folder.absolutePath
            inputs.files(["metadata.json", "public-trace.json", "game-result.properties"].collect { new File(folder, it) })
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(":game-core")
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20240205"
}
