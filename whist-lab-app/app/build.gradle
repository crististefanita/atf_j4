plugins {
    id "com.android.application"
}

android {
    namespace "ro.whistlab.app"
    compileSdk 36

    defaultConfig {
        applicationId "ro.whistlab.app"
        minSdk 24
        targetSdk 36
        versionCode 31
        versionName "0.21.0"
        testInstrumentationRunner "ro.whistlab.app.score.nativecomponent.HistoryMarksComponentInstrumentation"
    }

    buildFeatures {
        buildConfig true
    }

    testOptions.unitTests.all {
        def displaySelection = providers.gradleProperty("whist.displayComponents").getOrElse("false")
        if (!(displaySelection in ["true", "false"])) {
            throw new GradleException("whist.displayComponents must be true or false")
        }
        if (displaySelection == "true") {
            filter {
                includeTestsMatching "ro.whistlab.app.table.*"
                includeTestsMatching "ro.whistlab.app.bidding.*"
                includeTestsMatching "ro.whistlab.app.theme.*"
                includeTestsMatching "ro.whistlab.app.animation.*"
                includeTestsMatching "ro.whistlab.app.presentation.*"
                includeTestsMatching "ro.whistlab.app.lifecycle.CompletedTrick*"
                includeTestsMatching "ro.whistlab.app.seat.*"
                includeTestsMatching "ro.whistlab.app.window.*"
                includeTestsMatching "ro.whistlab.app.score.ScoreHistoryTableComponentTest"
                includeTestsMatching "ro.whistlab.app.score.ScoreHistorySeriesComponentTest"
                includeTestsMatching "ro.whistlab.app.score.award.*"
                includeTestsMatching "ro.whistlab.app.score.ScoreHistoryGridMetricsComponentTest"
                includeTestsMatching "ro.whistlab.app.score.ScoreHistoryOutcomeComponentTest"
                includeTestsMatching "ro.whistlab.app.score.ScoreHistoryMeasureComponentTest"
                includeTestsMatching "ro.whistlab.app.score.layout.*"
                includeTestsMatching "ro.whistlab.app.score.ScoreHistoryCheckpointTest"
                includeTestsMatching "ro.whistlab.app.localization.WhistUiTextTest"
                includeTestsMatching "ro.whistlab.app.screens.*"
                includeTestsMatching "ro.whistlab.app.cards.*"
            }
        }
        def archive = providers.gradleProperty("whist.scoreHistoryTraceDir").getOrElse("")
        if (!archive) exclude "**/ArchivedScoreHistoryReplayTest.class"
        if (archive) {
            def folder = rootProject.file(archive)
            systemProperty "whist.scoreHistoryTraceDir", folder.absolutePath
            inputs.files(["metadata.json", "public-trace.json", "game-result.properties"].collect { new File(folder, it) })
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.5"
    implementation project(":game-core")
    implementation project(":atf-card-table-ui")
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20240205"
}

// Host graphics need the complete JDK; Android unit compilation intentionally has a smaller API surface.
def rasterCompile = tasks.register("compileHistoryRasterTestJava", JavaCompile) {
    dependsOn "compileDebugUnitTestJavaWithJavac"
    source fileTree("src/rasterTest/java") { include "**/*.java" }
    classpath = tasks.named("testDebugUnitTest", Test).get().classpath
    destinationDirectory = layout.buildDirectory.dir("classes/java/historyRasterTest")
    options.release = 17
    options.encoding = "UTF-8"
    options.compilerArgs += ["-proc:none"]
}

def rasterTest = tasks.register("historyRasterTest", Test) {
    dependsOn rasterCompile
    testClassesDirs = files(rasterCompile.flatMap { it.destinationDirectory })
    classpath = files(testClassesDirs, tasks.named("testDebugUnitTest", Test).get().classpath)
    useJUnit()
    systemProperty "java.awt.headless", "true"
    def rasterOutput = providers.gradleProperty("whist.historyRasterOutput").getOrElse("")
    if (rasterOutput) systemProperty "whist.historyRasterOutput", rootProject.file(rasterOutput).absolutePath
}

tasks.named("check") { dependsOn rasterTest }

apply from: rootProject.file('gradle/app-component-collections.gradle')
apply from: 'achievement-catalog.gradle'
