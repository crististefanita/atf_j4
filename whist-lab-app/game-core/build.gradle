plugins {
    id "java-library"
    id "jacoco"
}

jacoco { toolVersion = "0.8.14" }

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

dependencies {
    testImplementation "junit:junit:4.13.2"
    testImplementation "com.fasterxml.jackson.core:jackson-databind:2.17.2"
}
sourceSets.test.java.srcDir("../ai-lab/src/main/java")

tasks.withType(Test).configureEach { maxHeapSize = "256m" }

tasks.named("jacocoTestReport") {
    dependsOn tasks.named("test")
    reports { xml.required = true; html.required = true }
}

tasks.named("test", Test) {
    exclude "**/ObservedOriginalReplayTest.class"
    exclude "**/AiTournamentTest.class"
    exclude "**/AiTrainingTournamentTest.class"
    exclude "**/ComponentCorpusCollectorTest.class"
    exclude "**/RoundTwoFreezeParityTest.class"
    exclude "**/DualLearningTournamentTest.class"
    exclude "**/RoundFourTournamentTest.class"
    exclude "**/RoundFiveTournamentTest.class"
    systemProperty "whist.componentEvidence", providers.gradleProperty("whist.componentEvidence").getOrElse("")
}
tasks.register("corpusTest", Test) {
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    filter { includeTestsMatching "ro.whistlab.core.ComponentCorpusCollectorTest" }
    for (def key : ["whist.corpusDir", "whist.corpusSeeds", "whist.corpusFirstSeed", "whist.corpusVariant", "whist.corpusOpponent"])
        systemProperty key, providers.gradleProperty(key).getOrElse("")
}
tasks.register("freezeParityTest", Test) {
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    filter { includeTestsMatching "ro.whistlab.core.RoundTwoFreezeParityTest" }
}
tasks.register("dualLearningTest", Test) {
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    filter { includeTestsMatching "ro.whistlab.core.DualLearningTournamentTest" }
    for (def key : ["whist.corpusDir", "whist.learningOutput", "whist.learningCandidate", "whist.learningPhase", "whist.learningRole"])
        systemProperty key, providers.gradleProperty(key).getOrElse("")
}
tasks.register("roundFourTest", Test) {
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    filter { includeTestsMatching "ro.whistlab.core.RoundFourTournamentTest" }
    for (def key : ["whist.round4.output", "whist.round4.corpus", "whist.round4.candidate", "whist.round4.phase", "whist.round4.role"])
        systemProperty key, providers.gradleProperty(key).getOrElse(key=="whist.round4.phase"?"development":"")
    outputs.upToDateWhen { false }
}
tasks.register("aiTrainingTest", Test) {
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    filter { includeTestsMatching "ro.whistlab.core.AiTrainingTournamentTest" }
    systemProperty "whist.componentEvidence", providers.gradleProperty("whist.componentEvidence").getOrElse("")
    systemProperty "whist.aiTrainingPhase", providers.gradleProperty("whist.aiTrainingPhase").getOrElse("development")
    systemProperty "whist.aiTrainingSeeds", providers.gradleProperty("whist.aiTrainingSeeds").getOrElse("8")
    systemProperty "whist.aiCandidate", providers.gradleProperty("whist.aiCandidate").getOrElse("FULL")
    systemProperty "whist.streakBonus", providers.gradleProperty("whist.streakBonus").getOrElse("0")
}

tasks.register("aiTournamentTest", Test) {
    description = "Pairs Expert and Hard on declared held-out deals with rotated seats."
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    filter { includeTestsMatching "ro.whistlab.core.AiTournamentTest" }
    systemProperty "whist.componentEvidence", providers.gradleProperty("whist.componentEvidence").getOrElse("")
    systemProperty "whist.aiBenchmarkSeeds", providers.gradleProperty("whist.aiBenchmarkSeeds").getOrElse("8")
}

tasks.register("originalReplayTest", Test) {
    description = "Replays retained original game inputs through the normal rules engine."
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    filter { includeTestsMatching "ro.whistlab.core.ObservedOriginalReplayTest" }
    systemProperty "whist.originalReplay", providers.gradleProperty("whist.originalReplay").getOrElse("")
    systemProperty "whist.allowPartialReplay", providers.gradleProperty("whist.allowPartialReplay").getOrElse("false")
    inputs.file(providers.gradleProperty("whist.originalReplay")).withPropertyName("observedOriginalMatch")
}

// Collection entrypoints: default regression stays offline; learning is opt-in.
tasks.register("regressionTest") { dependsOn tasks.named("test") }
tasks.register("learningTest", Test) {
 testClassesDirs=sourceSets.test.output.classesDirs
 classpath=sourceSets.test.runtimeClasspath
 filter { includeTestsMatching "ro.whistlab.core.RoundFiveTournamentTest" }
 for(def key:["whist.round5.output","whist.round5.corpus","whist.round5.candidate","whist.round5.phase","whist.round5.role"])systemProperty key,providers.gradleProperty(key).getOrElse(key=="whist.round5.phase"?"development":"")
 outputs.upToDateWhen { false }
}

// Deterministic minutes-scale rule checks; no tournaments and no device.
tasks.register("quickRegressionTest", Test) {
    testClassesDirs=sourceSets.test.output.classesDirs
    classpath=sourceSets.test.runtimeClasspath
    filter { for(def name:["GameRulesBoundaryTest","RomanianWhistRulesTest","RomanianStreakContractTest","GameCheckpointRejectionTest","HowToPlayDocumentationTest","OneCardBidBeliefTest"])includeTestsMatching "ro.whistlab.core."+name }
}
tasks.register("documentationTest", Test) {
    testClassesDirs=sourceSets.test.output.classesDirs
    classpath=sourceSets.test.runtimeClasspath
    filter { includeTestsMatching "ro.whistlab.core.HowToPlayDocumentationTest" }
    for(def key:["whist.documentationEvidence","whist.documentationMarkdown","whist.documentationRunId"])systemProperty key,providers.gradleProperty(key).getOrElse("")
    outputs.upToDateWhen { false }
}
