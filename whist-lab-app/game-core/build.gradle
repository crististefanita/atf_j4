plugins {
    id "java-library"
    id "jacoco"
}

jacoco { toolVersion = "0.8.14" }

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

dependencies {
    testImplementation "junit:junit:4.13.2"
    testImplementation "com.fasterxml.jackson.core:jackson-databind:2.17.2"
}
sourceSets.test.java.srcDir("../ai-lab/src/main/java")

tasks.withType(Test).configureEach { maxHeapSize = "256m" }

tasks.named("jacocoTestReport") {
    dependsOn tasks.named("test")
    reports { xml.required = true; html.required = true }
}

tasks.named("test", Test) {
    exclude "**/ObservedOriginalReplayTest.class"
    exclude "**/AiTournamentTest.class"
    exclude "**/AiTrainingTournamentTest.class"
    exclude "**/ComponentCorpusCollectorTest.class"
    exclude "**/RoundTwoFreezeParityTest.class"
    exclude "**/DualLearningTournamentTest.class"
    exclude "**/RoundFourTournamentTest.class"
    exclude "**/RoundFiveTournamentTest.class"
    exclude "**/RoundSixTournamentTest.class"
    exclude "**/RoundSevenTournamentTest.class"
    exclude "**/StrategyArenaTest.class"
    exclude "**/ArenaProfileReplayTest.class"
    exclude "**/FrozenV8ParityTest.class"
    exclude "**/LossMiningTest.class"
    exclude "**/BidEvidenceTest.class"
    systemProperty "whist.componentEvidence", providers.gradleProperty("whist.componentEvidence").getOrElse("")
}
tasks.register("corpusTest", Test) {
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    filter { includeTestsMatching "ro.whistlab.core.ComponentCorpusCollectorTest" }
    for (def key : ["whist.corpusDir", "whist.corpusSeeds", "whist.corpusFirstSeed", "whist.corpusVariant", "whist.corpusOpponent"])
        systemProperty key, providers.gradleProperty(key).getOrElse("")
}
tasks.register("freezeParityTest", Test) {
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    filter { includeTestsMatching "ro.whistlab.core.RoundTwoFreezeParityTest" }
}
tasks.register("dualLearningTest", Test) {
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    filter { includeTestsMatching "ro.whistlab.core.DualLearningTournamentTest" }
    for (def key : ["whist.corpusDir", "whist.learningOutput", "whist.learningCandidate", "whist.learningPhase", "whist.learningRole"])
        systemProperty key, providers.gradleProperty(key).getOrElse("")
}
tasks.register("roundFourTest", Test) {
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    filter { includeTestsMatching "ro.whistlab.core.RoundFourTournamentTest" }
    for (def key : ["whist.round4.output", "whist.round4.corpus", "whist.round4.candidate", "whist.round4.phase", "whist.round4.role"])
        systemProperty key, providers.gradleProperty(key).getOrElse(key=="whist.round4.phase"?"development":"")
    outputs.upToDateWhen { false }
}
tasks.register("aiTrainingTest", Test) {
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    filter { includeTestsMatching "ro.whistlab.core.AiTrainingTournamentTest" }
    systemProperty "whist.componentEvidence", providers.gradleProperty("whist.componentEvidence").getOrElse("")
    systemProperty "whist.aiTrainingPhase", providers.gradleProperty("whist.aiTrainingPhase").getOrElse("development")
    systemProperty "whist.aiTrainingSeeds", providers.gradleProperty("whist.aiTrainingSeeds").getOrElse("8")
    systemProperty "whist.aiCandidate", providers.gradleProperty("whist.aiCandidate").getOrElse("FULL")
    systemProperty "whist.streakBonus", providers.gradleProperty("whist.streakBonus").getOrElse("0")
}

tasks.register("aiTournamentTest", Test) {
    description = "Pairs Expert and Hard on declared held-out deals with rotated seats."
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    filter { includeTestsMatching "ro.whistlab.core.AiTournamentTest" }
    systemProperty "whist.componentEvidence", providers.gradleProperty("whist.componentEvidence").getOrElse("")
    systemProperty "whist.aiBenchmarkSeeds", providers.gradleProperty("whist.aiBenchmarkSeeds").getOrElse("8")
}

tasks.register("originalReplayTest", Test) {
    description = "Replays retained original game inputs through the normal rules engine."
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    filter { includeTestsMatching "ro.whistlab.core.ObservedOriginalReplayTest" }
    systemProperty "whist.originalReplay", providers.gradleProperty("whist.originalReplay").getOrElse("")
    systemProperty "whist.allowPartialReplay", providers.gradleProperty("whist.allowPartialReplay").getOrElse("false")
    inputs.file(providers.gradleProperty("whist.originalReplay")).withPropertyName("observedOriginalMatch")
}

// Collection entrypoints: default regression stays offline; learning is opt-in.
tasks.register("regressionTest") { dependsOn tasks.named("test") }
tasks.register("legacyRoundFiveTest", Test) {
 testClassesDirs=sourceSets.test.output.classesDirs
 classpath=sourceSets.test.runtimeClasspath
 filter { includeTestsMatching "ro.whistlab.core.RoundFiveTournamentTest" }
 for(def key:["whist.round5.output","whist.round5.corpus","whist.round5.candidate","whist.round5.phase","whist.round5.role"])systemProperty key,providers.gradleProperty(key).getOrElse(key=="whist.round5.phase"?"development":"")
 outputs.upToDateWhen { false }
}

tasks.register("learningTest") { dependsOn "roundElevenTest" }

// Deterministic minutes-scale rule checks; no tournaments and no device.
tasks.register("quickRegressionTest", Test) {
    testClassesDirs=sourceSets.test.output.classesDirs
    classpath=sourceSets.test.runtimeClasspath
    filter { for(def name:["GameRulesBoundaryTest","RomanianWhistRulesTest","RomanianStreakContractTest","GameCheckpointRejectionTest","HowToPlayDocumentationTest","OneCardBidBeliefTest","LostGameContractRegressionTest","LateDiscardBoundaryTest","ObservedLateMissRegressionTest","SafetyPreferenceTest","SafetyPlanningCasesTest","ContextualHonorGuaranteeTest"])includeTestsMatching "ro.whistlab.core."+name }
}
tasks.register("documentationTest", Test) {
    testClassesDirs=sourceSets.test.output.classesDirs
    classpath=sourceSets.test.runtimeClasspath
    filter { includeTestsMatching "ro.whistlab.core.HowToPlayDocumentationTest" }
    for(def key:["whist.documentationEvidence","whist.documentationMarkdown","whist.documentationRunId"])systemProperty key,providers.gradleProperty(key).getOrElse("")
    outputs.upToDateWhen { false }
}

tasks.register("lossMiningTest",Test) { testClassesDirs=sourceSets.test.output.classesDirs;classpath=sourceSets.test.runtimeClasspath;filter {includeTestsMatching "ro.whistlab.core.LossMiningTest"};for(def key:["whist.mine.receipts","whist.mine.corpus","whist.mine.output"])systemProperty key,providers.gradleProperty(key).getOrElse("");outputs.upToDateWhen{false} }

tasks.register("roundSixTest", Test){testClassesDirs=sourceSets.test.output.classesDirs;classpath=sourceSets.test.runtimeClasspath;filter{includeTestsMatching "ro.whistlab.core.RoundSixTournamentTest"};for(def key:["whist.round6.output","whist.round6.corpus","whist.round6.candidate","whist.round6.phase","whist.round6.role","whist.round6.firstSeed","whist.round6.seeds"])systemProperty key,providers.gradleProperty(key).getOrElse(key=="whist.round6.phase"?"development":"");outputs.upToDateWhen{false}}

tasks.register("bidEvidenceResearchTest",Test){testClassesDirs=sourceSets.test.output.classesDirs;classpath=sourceSets.test.runtimeClasspath;filter{includeTestsMatching "ro.whistlab.core.BidEvidenceTest"}}

tasks.register("roundSevenTest", Test){testClassesDirs=sourceSets.test.output.classesDirs;classpath=sourceSets.test.runtimeClasspath;filter{includeTestsMatching "ro.whistlab.core.RoundSevenTournamentTest"};for(def key:["whist.round7.output","whist.round7.corpus","whist.round7.candidate","whist.round7.phase","whist.round7.role","whist.round7.playerBaseline","whist.round7.opponent","whist.round7.seat","whist.round7.casesFile","whist.round7.firstSeed","whist.round7.seeds"])systemProperty key,providers.gradleProperty(key).getOrElse(key=="whist.round7.phase"?"development":"");outputs.upToDateWhen{false}}

tasks.named("roundSevenTest", Test){ jacoco.enabled=false }

tasks.register("algorithmGuideTest",Test){testClassesDirs=sourceSets.test.output.classesDirs;classpath=sourceSets.test.runtimeClasspath;filter{for(def name:["RolloutPolicyRegressionTest","RolloutBoundsOracleTest","DominantBidContractTest","FrozenContinuationContractTest","SafetyPreferenceTest","SafetyPlanningCasesTest","FrozenV8ParityTest"])includeTestsMatching "ro.whistlab.core."+name};systemProperty "whist.componentEvidence",providers.gradleProperty("whist.componentEvidence").getOrElse("")}

tasks.register("strategyArenaTest",Test){testClassesDirs=sourceSets.test.output.classesDirs;classpath=sourceSets.test.runtimeClasspath;filter{includeTestsMatching "ro.whistlab.core.StrategyArenaTest"};for(def key:["whist.arena.protocol","whist.arena.output","whist.arena.corpus"])systemProperty key,providers.gradleProperty(key).getOrElse("");jacoco.enabled=false;outputs.upToDateWhen{false}}

tasks.register("arenaContractTest",Test){testClassesDirs=sourceSets.test.output.classesDirs;classpath=sourceSets.test.runtimeClasspath;filter{includeTestsMatching "ro.whistlab.core.ArenaProfileReplayTest";includeTestsMatching "ro.whistlab.core.FrozenV8ParityTest"};systemProperty "whist.componentEvidence",providers.gradleProperty("whist.componentEvidence").getOrElse("")}

tasks.named("strategyArenaTest",Test){ dependsOn "arenaContractTest" }

tasks.named("test",Test){exclude "**/RoundElevenTournamentTest.class";exclude "**/ArenaLossMiningTest.class"}
tasks.register("roundElevenTest", Test){testClassesDirs=sourceSets.test.output.classesDirs;classpath=sourceSets.test.runtimeClasspath;filter{includeTestsMatching "ro.whistlab.core.RoundElevenTournamentTest"};for(def key:["whist.round11.output","whist.round11.corpus","whist.round11.candidate","whist.round11.phase","whist.round11.role","whist.round11.playerBaseline","whist.round11.opponent","whist.round11.seat","whist.round11.casesFile","whist.round11.firstSeed","whist.round11.seeds"])systemProperty key,providers.gradleProperty(key).getOrElse(key=="whist.round11.phase"?"development":"");jacoco.enabled=false;outputs.upToDateWhen{false}}

tasks.register("arenaLossMiningTest",Test){testClassesDirs=sourceSets.test.output.classesDirs;classpath=sourceSets.test.runtimeClasspath;filter{includeTestsMatching "ro.whistlab.core.ArenaLossMiningTest"};for(def key:["whist.loss.positions","whist.loss.output"])systemProperty key,providers.gradleProperty(key).getOrElse("");jacoco.enabled=false;outputs.upToDateWhen{false}}

tasks.named("quickRegressionTest",Test){filter{for(def name:["PromotedMasterLossTest","BidForecastContractTest","LearningBaselineOptionTest"])includeTestsMatching "ro.whistlab.core."+name}}

tasks.named("test",Test){exclude "**/ScoreTranslationRegressionTest.class"}
tasks.register("scoreConsistencyDiagnosticTest",Test){testClassesDirs=sourceSets.test.output.classesDirs;classpath=sourceSets.test.runtimeClasspath;filter{includeTestsMatching "ro.whistlab.core.ScoreTranslationRegressionTest"};systemProperty "whist.componentEvidence",providers.gradleProperty("whist.componentEvidence").getOrElse("");jacoco.enabled=false;outputs.upToDateWhen{false}}

tasks.named("quickRegressionTest",Test){filter{includeTestsMatching "ro.whistlab.core.SmallWorldEnumerationTest";includeTestsMatching "ro.whistlab.core.EnumerationBudgetTest"}}

tasks.named("quickRegressionTest",Test){filter{includeTestsMatching "ro.whistlab.core.CertifiedContractRegressionTest"}}
