plugins {
    id "java-library"
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

dependencies { testImplementation "junit:junit:4.13.2" }

tasks.withType(Test).configureEach {
    maxHeapSize = "128m"
    systemProperty "whist.coach.runtimeClasspath", sourceSets.main.runtimeClasspath.asPath
}

// Default components use constructed local data. Archive replay has its own explicit entrypoint.
tasks.register("testTools", Exec) {
    group = "verification"
    description = "Runs the AI laboratory's offline Node component tests."
    workingDir projectDir.parentFile.parentFile
    def tests = fileTree("tools") { include "**/*.test.mjs" }.files.sort { it.path }
    inputs.files(fileTree("tools"))
    commandLine([providers.gradleProperty("nodeExecutable").getOrElse("node"),
            "--test", "--test-concurrency=1"] + tests.collect { it.absolutePath })
}

tasks.named("check") { dependsOn tasks.named("testTools") }

tasks.register("replayArchive", Exec) {
    group = "verification"
    description = "Replays an explicitly selected and SHA-256-sealed external game."
    workingDir projectDir.parentFile.parentFile
    doFirst {
        def fixture = providers.gradleProperty("whist.archive.file").orNull
        def seal = providers.gradleProperty("whist.archive.sha256").orNull
        if (!fixture || !seal || !(seal ==~ /(?i)[a-f0-9]{64}/))
            throw new GradleException("Archive replay requires whist.archive.file and whist.archive.sha256")
        commandLine providers.gradleProperty("nodeExecutable").getOrElse("node"),
                file("tools/corpus/whist-corpus-cli.mjs").absolutePath, "replay", fixture, seal
    }
}
