

pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "whist-lab-app"
def uiMode = providers.gradleProperty("cardui.only").getOrElse("")
if (!(uiMode in ["", "package", "component"])) throw new GradleException("Unknown cardui.only mode")
include(":atf-card-table-ui")
if (uiMode != "package") include(":test-audit")
if (uiMode.isEmpty()) include(":game-core", ":ai-lab", ":app", ":card-table-names", ":ios-bridge")
