name: WhistLab
options:
  bundleIdPrefix: ro.whistlab
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_ALLOWED: "NO"
targets:
  WhistLab:
    type: application
    platform: iOS
    sources:
      - path: WhistLab
      - path: build/generated
        excludes:
          - "**/*.h"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ro.whistlab.app.ios
        PRODUCT_NAME: WhistLab
        MARKETING_VERSION: 0.13.0
        CURRENT_PROJECT_VERSION: 19
        INFOPLIST_KEY_CFBundleDisplayName: Whist Lab
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.card-games
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_OBJC_BRIDGING_HEADER: WhistLab/WhistLab-Bridging-Header.h
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        HEADER_SEARCH_PATHS: "$(inherited) $(J2OBJC_HOME)/include $(SRCROOT)/build/generated/**"
        LIBRARY_SEARCH_PATHS: "$(inherited) $(J2OBJC_HOME)/lib"
        OTHER_LDFLAGS: "$(inherited) -ljre_emul -liconv"
        # J2ObjC emits manual-reference-counted Objective-C by default.
        CLANG_ENABLE_OBJC_ARC: NO
        SWIFT_STRICT_CONCURRENCY: minimal
    scheme:
      testTargets:
        - WhistLabTests
  WhistLabTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WhistLabTests
    dependencies:
      - target: WhistLab
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ro.whistlab.app.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1,2"
